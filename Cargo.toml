[package]
name = "statusline"
version = "0.1.1"
edition = "2021"
description = "Minimal powerline status line for Claude Code"
license = "MIT"
repository = "https://github.com/saimaz/statusline"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
