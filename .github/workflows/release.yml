# On a v* tag: build macOS binaries (arm64 + x86_64), attach them to a
# GitHub Release with sha256 files, then bump the Homebrew formula in
# saimaz/homebrew-tap. The tap bump pushes over SSH using the
# TAP_DEPLOY_KEY secret (private half of a write deploy key on
# saimaz/homebrew-tap); without it the release still publishes and the
# formula is bumped by hand.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    # arm64 runner; the x86_64 target cross-compiles fine on it
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          rustup target add ${{ matrix.target }}
          cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          tar -czf statusline-${{ matrix.target }}.tar.gz \
            -C target/${{ matrix.target }}/release statusline
          shasum -a 256 statusline-${{ matrix.target }}.tar.gz \
            > statusline-${{ matrix.target }}.tar.gz.sha256

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            statusline-${{ matrix.target }}.tar.gz
            statusline-${{ matrix.target }}.tar.gz.sha256

  update-tap:
    name: Bump Homebrew formula
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check for deploy key
        id: token
        run: |
          if [ -n "${{ secrets.TAP_DEPLOY_KEY }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "TAP_DEPLOY_KEY not set, skipping formula bump" >&2
          fi

      - name: Checkout tap
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v4
        with:
          repository: saimaz/homebrew-tap
          ssh-key: ${{ secrets.TAP_DEPLOY_KEY }}

      - name: Regenerate formula
        if: steps.token.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.sha256'
          ARM_SHA=$(cut -d' ' -f1 statusline-aarch64-apple-darwin.tar.gz.sha256)
          X86_SHA=$(cut -d' ' -f1 statusline-x86_64-apple-darwin.tar.gz.sha256)
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          mkdir -p Formula
          cat > Formula/statusline.rb <<EOF
          class Statusline < Formula
            desc "Minimal powerline status line for Claude Code"
            homepage "https://github.com/saimaz/statusline"
            version "${VERSION}"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "${BASE}/statusline-aarch64-apple-darwin.tar.gz"
                sha256 "${ARM_SHA}"
              else
                url "${BASE}/statusline-x86_64-apple-darwin.tar.gz"
                sha256 "${X86_SHA}"
              end
            end

            def install
              bin.install "statusline"
            end

            test do
              pipe_output("#{bin}/statusline", "{}", 0)
            end
          end
          EOF
          rm -f ./*.sha256

      - name: Push formula
        if: steps.token.outputs.present == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/statusline.rb
          git diff --cached --quiet && { echo "formula unchanged"; exit 0; }
          git commit -m "statusline ${GITHUB_REF_NAME}"
          git push
